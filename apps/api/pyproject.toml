[project]
name = "smart-living-api"
version = "0.1.0"
description = "Smart Living API — recommendation engine deterministik dari bahan makanan sisa ke ide masakan"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "httpx2==2.12.0",
    "ruff==0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest]
addopts = ["-v", "--tb=short", "--cov=app", "--cov-report=term-missing"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/services/ai/*"]

[tool.coverage.report]
# Core recommendation logic wajib teruji (docs/development-roadmap.md §11).
fail_under = 90
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
