name: Deploy API to Hugging Face Spaces

# Hanya deploy setelah CI hijau — kode yang gagal test tidak boleh sampai ke
# production. `workflow_dispatch` disediakan untuk deploy manual bila diperlukan.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: false

permissions:
  contents: read

env:
  HF_USERNAME: Callmerev95
  HF_SPACE: smart-living-api

jobs:
  deploy:
    name: Sync ke Space
    runs-on: ubuntu-latest
    # Guard ganda: `workflow_run` bisa terpicu oleh CI yang gagal, jadi
    # kesimpulannya harus diperiksa eksplisit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Staging dir MENIRU struktur repo, sehingga `docker/api.Dockerfile` bisa
      # dipakai apa adanya tanpa mengubah satu baris pun. Tidak ada Dockerfile
      # versi kedua yang bisa menyimpang dari yang diuji CI.
      - name: Bangun staging directory
        run: |
          set -euo pipefail

          rm -rf /tmp/hf-space
          mkdir -p /tmp/hf-space/apps/api /tmp/hf-space/data

          # HF hanya membaca `Dockerfile` di root repo Space.
          cp docker/api.Dockerfile /tmp/hf-space/Dockerfile

          # README dengan YAML front matter — konfigurasi Space ada di situ.
          cp docker/hf-space-README.md /tmp/hf-space/README.md

          # Path harus persis seperti yang dirujuk Dockerfile:
          #   COPY apps/api/pyproject.toml apps/api/uv.lock apps/api/.python-version ./
          #   COPY apps/api/app ./app
          #   COPY data/recipes ./data/recipes
          cp apps/api/pyproject.toml apps/api/uv.lock apps/api/.python-version \
            /tmp/hf-space/apps/api/
          cp -r apps/api/app /tmp/hf-space/apps/api/app
          cp -r data/recipes /tmp/hf-space/data/recipes

          # Bersihkan artefak Python. Di runner CI checkout-nya bersih, tapi
          # langkah ini membuat hasil staging deterministik walau script yang sama
          # dijalankan di mesin lokal yang sudah pernah menjalankan test.
          find /tmp/hf-space -name '__pycache__' -type d -prune -exec rm -rf {} +
          find /tmp/hf-space -name '*.py[cod]' -delete

          # `.dockerignore` tidak disertakan: staging dir sudah minimal, dan
          # aturannya mengecualikan `docker/` yang di sini menjadi root.

      - name: Verifikasi isi staging
        run: |
          set -euo pipefail
          cd /tmp/hf-space

          # Gagalkan lebih awal bila ada berkas wajib yang tertinggal, supaya
          # error muncul di sini alih-alih sebagai build failure di HF.
          for path in Dockerfile README.md apps/api/pyproject.toml apps/api/uv.lock \
                      apps/api/.python-version apps/api/app/main.py \
                      data/recipes/recipes.json data/recipes/ingredients.json; do
            test -e "$path" || { echo "HILANG: $path"; exit 1; }
          done

          # Front matter wajib ada, kalau tidak Space tidak akan dikenali Docker SDK.
          head -1 README.md | grep -q '^---$' || { echo "README tanpa front matter"; exit 1; }
          grep -q '^sdk: docker$' README.md || { echo "sdk: docker tidak ada"; exit 1; }

          # Artefak build maupun secret tidak boleh ikut ter-push.
          if find . -name '__pycache__' -o -name '*.pyc' -o -name '.env' | grep -q .; then
            echo "Ada artefak/secret yang ikut ter-staging:"
            find . -name '__pycache__' -o -name '*.pyc' -o -name '.env'
            exit 1
          fi

          echo "Struktur staging:"
          find . -type f | sort

      - name: Push ke Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${HF_TOKEN}" ]; then
            echo "Secret HF_TOKEN belum diset di repository settings."
            exit 1
          fi

          cd /tmp/hf-space
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sync dari ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"

          # Force push aman: staging selalu satu commit bersih, dan riwayat
          # sesungguhnya tersimpan di GitHub.
          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" \
            main

      - name: Ringkasan
        run: |
          echo "Space: https://huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}"
          echo "API:   https://${HF_USERNAME,,}-${HF_SPACE}.hf.space/api/v1/health"
          echo ""
          echo "Build memakan waktu 2-4 menit. Pantau tab Logs di halaman Space."
